# Deploy Gilbert Guide to GitHub Pages (gh-pages branch)
# Repo: https://github.com/GildedGooseltd/PickyPavi
# Live: https://gildedgooseltd.github.io/PickyPavi/
# Enable: repo Settings → Pages → Deploy from branch gh-pages / root
# Webhook: secret PAV_PICKER_WEBHOOK_URL if set; else committed pages-config.defaults.js
# Optional: PAV_PICKER_DEPOSIT_AMOUNT (default 2500), PAV_PICKER_QUICKBOOKS_DEPOSIT_URL

name: Deploy Gilbert Guide

on:
  push:
    paths:
      - "gilded-goose/clients/pav-law/project-picker/**"
      - ".github/workflows/pav-project-picker-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build projects-data.js from content/
        working-directory: gilded-goose/clients/pav-law/project-picker
        run: npm run build

      - name: Write pages-config.js (secret or committed default)
        working-directory: gilded-goose/clients/pav-law/project-picker
        env:
          WEBHOOK_URL: ${{ secrets.PAV_PICKER_WEBHOOK_URL }}
          DEPOSIT_AMOUNT: ${{ secrets.PAV_PICKER_DEPOSIT_AMOUNT }}
          QUICKBOOKS_URL: ${{ secrets.PAV_PICKER_QUICKBOOKS_DEPOSIT_URL }}
        run: |
          set -euo pipefail
          WEBHOOK_TRIM="$(printf '%s' "${WEBHOOK_URL:-}" | tr -d '[:space:]')"
          DEP="${DEPOSIT_AMOUNT:-2500}"
          QB="$(printf '%s' "${QUICKBOOKS_URL:-}" | tr -d '[:space:]')"
          NOTIFY="support@gildedgooselimited.com"
          SOURCE="secret"

          if [ -z "$WEBHOOK_TRIM" ] && [ -f pages-config.defaults.js ]; then
            WEBHOOK_TRIM="$(sed -n 's/.*webhookUrl:[[:space:]]*"\([^"]*\)".*/\1/p' pages-config.defaults.js | head -1 | tr -d '[:space:]')"
            SOURCE="pages-config.defaults.js"
            echo "PAV_PICKER_WEBHOOK_URL empty — using committed $SOURCE"
          fi

          if [ -z "$WEBHOOK_TRIM" ] && [ -f pages-config.js ]; then
            WEBHOOK_TRIM="$(sed -n 's/.*webhookUrl:[[:space:]]*"\([^"]*\)".*/\1/p' pages-config.js | head -1 | tr -d '[:space:]')"
            SOURCE="pages-config.js"
            echo "Falling back to committed $SOURCE"
          fi

          if [ -z "$WEBHOOK_TRIM" ]; then
            echo "::error title=No webhook URL::Neither secret nor committed pages-config.defaults.js has a webhookUrl."
            exit 1
          fi

          if [[ "$WEBHOOK_TRIM" != *"/exec" ]]; then
            echo "::error title=Bad webhook shape::webhookUrl must end in /exec. Source=$SOURCE"
            exit 1
          fi

          # Escape for JS double-quoted string
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }

          {
            printf '%s\n' "/** Generated by Deploy Gilbert Guide — source: ${SOURCE}. */"
            printf 'window.PAV_PICKER_CONFIG = {\n'
            printf '  webhookUrl: "%s",\n' "$(esc "$WEBHOOK_TRIM")"
            printf '  depositAmount: %s,\n' "$DEP"
            printf '  quickbooksDepositUrl: "%s",\n' "$(esc "$QB")"
            printf '  notifyEmail: "%s"\n' "$(esc "$NOTIFY")"
            printf '};\n'
          } > pages-config.js

          echo "Wrote pages-config.js (source=$SOURCE, webhookUrl length=${#WEBHOOK_TRIM}, depositAmount=$DEP, qb=$([ -n "$QB" ] && echo set || echo empty))"
          grep -E 'webhookUrl:' pages-config.js | sed 's|\(https://script.google.com/macros/s/\)[^/]*|\1…|'

          if grep -Eq 'webhookUrl:[[:space:]]*""' pages-config.js; then
            echo "::error title=Inject failed::pages-config.js still has empty webhookUrl after write."
            exit 1
          fi
          if ! grep -Eq 'webhookUrl:[[:space:]]*"https?://[^"]+/exec"' pages-config.js; then
            echo "::error title=Inject failed::pages-config.js webhookUrl is not a valid /exec URL."
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gilded-goose/clients/pav-law/project-picker
          branch: gh-pages
          clean: true
