# Deploy Gilbert Guide to GitHub Pages (gh-pages branch)
# Repo: https://github.com/GildedGooseltd/PickyPavi
# Live: https://gildedgooseltd.github.io/PickyPavi/
# Enable: repo Settings → Pages → Deploy from branch gh-pages / root
# Required secret: PAV_PICKER_WEBHOOK_URL = Apps Script web app /exec URL
# Optional: PAV_PICKER_DEPOSIT_AMOUNT (default 2500), PAV_PICKER_QUICKBOOKS_DEPOSIT_URL

name: Deploy Gilbert Guide

on:
  push:
    paths:
      - "gilded-goose/clients/pav-law/project-picker/**"
      - ".github/workflows/pav-project-picker-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build projects-data.js from content/
        working-directory: gilded-goose/clients/pav-law/project-picker
        run: npm run build

      - name: Write pages-config.js from secrets
        working-directory: gilded-goose/clients/pav-law/project-picker
        env:
          WEBHOOK_URL: ${{ secrets.PAV_PICKER_WEBHOOK_URL }}
          DEPOSIT_AMOUNT: ${{ secrets.PAV_PICKER_DEPOSIT_AMOUNT }}
          QUICKBOOKS_URL: ${{ secrets.PAV_PICKER_QUICKBOOKS_DEPOSIT_URL }}
        run: |
          set -euo pipefail
          WEBHOOK_TRIM="$(printf '%s' "${WEBHOOK_URL:-}" | tr -d '[:space:]')"
          DEP="${DEPOSIT_AMOUNT:-2500}"
          QB="$(printf '%s' "${QUICKBOOKS_URL:-}" | tr -d '[:space:]')"
          NOTIFY="support@gildedgooselimited.com"

          if [ -z "$WEBHOOK_TRIM" ]; then
            echo "::error title=Missing PAV_PICKER_WEBHOOK_URL::Secret PAV_PICKER_WEBHOOK_URL is empty or unset on GildedGooseltd/PickyPavi. Live Feedback Save cannot reach the Sheet until this is set."
            echo ""
            echo "Fix (browser — one time):"
            echo "  1. Copy Apps Script Web app URL ending in /exec"
            echo "  2. Paste as secret Name=PAV_PICKER_WEBHOOK_URL at:"
            echo "     https://github.com/GildedGooseltd/PickyPavi/settings/secrets/actions/new"
            echo "  3. Re-run this workflow, then verify:"
            echo "     https://gildedgooseltd.github.io/PickyPavi/pages-config.js"
            echo "     (webhookUrl must be the /exec URL — not empty)"
            echo ""
            echo "Do NOT set this secret on GilbertGuide — deploy runs on PickyPavi only."
            echo "Deploy continues so owner-webhook-setup.html stays reachable — but webhookUrl will stay empty until Secret 1 is set and this job is re-run."
            WEBHOOK_TRIM=""
          elif [[ "$WEBHOOK_TRIM" != *"/exec" ]]; then
            echo "::warning title=Unexpected webhook shape::PAV_PICKER_WEBHOOK_URL should end in /exec. Continuing — verify pages-config.js after deploy."
          fi

          # Escape for JS double-quoted string
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }

          {
            printf '%s\n' '/** Generated by Deploy Gilbert Guide — do not edit on gh-pages. Source: PickyPavi Actions secret PAV_PICKER_WEBHOOK_URL. */'
            printf 'window.PAV_PICKER_CONFIG = {\n'
            printf '  webhookUrl: "%s",\n' "$(esc "$WEBHOOK_TRIM")"
            printf '  depositAmount: %s,\n' "$DEP"
            printf '  quickbooksDepositUrl: "%s",\n' "$(esc "$QB")"
            printf '  notifyEmail: "%s"\n' "$(esc "$NOTIFY")"
            printf '};\n'
          } > pages-config.js

          echo "Wrote pages-config.js (webhookUrl length=${#WEBHOOK_TRIM}, depositAmount=$DEP, qb=$([ -n "$QB" ] && echo set || echo empty))"
          if [ -z "$WEBHOOK_TRIM" ]; then
            echo "::warning::pages-config.js webhookUrl is EMPTY — Feedback gather off until Secret 1 is set on PickyPavi and workflow re-run."
          else
            grep -E 'webhookUrl:' pages-config.js | sed 's|\(https://script.google.com/macros/s/\)[^/]*|\1…|'
          fi

          # Fail closed: never ship stub webhookUrl: ""
          if grep -Eq 'webhookUrl:[[:space:]]*""' pages-config.js; then
            echo "::error title=Inject failed::pages-config.js still has empty webhookUrl after write."
            exit 1
          fi
          if ! grep -Eq 'webhookUrl:[[:space:]]*"https?://' pages-config.js; then
            echo "::error title=Inject failed::pages-config.js webhookUrl is not an http(s) URL."
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gilded-goose/clients/pav-law/project-picker
          branch: gh-pages
          clean: true
