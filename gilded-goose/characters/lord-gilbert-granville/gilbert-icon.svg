<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Lord Gilbert Granville">
  <circle cx="48" cy="48" r="46" fill="#f8f5ef" stroke="#c9a86c" stroke-width="2"/>

  <!-- chest / body (wings folded behind — not shown) -->
  <ellipse cx="48" cy="72" rx="24" ry="12" fill="#f3ede4" stroke="#3d3028" stroke-width="1.35"/>
  <path d="M26 68c2-6 10-10 22-10s20 4 22 10v14H26V68z" fill="#3d3028"/>
  <path d="M30 66h36M32 72h32" stroke="#c9a86c" stroke-width="0.65" opacity="0.28"/>

  <!-- neck -->
  <path d="M40 54c-1-16 8-28 20-28 11 0 18 10 16 24" fill="#fffcf7" stroke="#3d3028" stroke-width="1.35" stroke-linejoin="round"/>

  <!-- head -->
  <ellipse cx="52" cy="30" rx="13" ry="11" fill="#fffcf7" stroke="#3d3028" stroke-width="1.35"/>

  <!-- beak -->
  <path d="M62 29l11 4.5-11 6z" fill="#c9a86c" stroke="#8b6914" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- round spectacles -->
  <circle cx="50" cy="29" r="5.2" stroke="#3d3028" stroke-width="1.6" fill="none"/>
  <circle cx="62" cy="29" r="5.2" stroke="#3d3028" stroke-width="1.6" fill="none"/>
  <path d="M55.2 29h6.8" stroke="#3d3028" stroke-width="1.3"/>
  <path d="M44.8 29h1.6" stroke="#3d3028" stroke-width="1.3"/>

  <!-- checkered bow tie -->
  <g stroke="#3d3028" stroke-width="0.9">
    <path d="M39 56h8l-4 5-4-5z" fill="#fff"/>
    <path d="M49 56h8l-4 5-4-5z" fill="#fff"/>
    <rect x="39" y="56" width="4" height="2.5" fill="#3d3028" stroke="none"/>
    <rect x="43" y="58.5" width="4" height="2.5" fill="#3d3028" stroke="none"/>
    <rect x="49" y="58.5" width="4" height="2.5" fill="#3d3028" stroke="none"/>
    <rect x="53" y="56" width="4" height="2.5" fill="#3d3028" stroke="none"/>
  </g>

  <!-- purple pocket square -->
  <path d="M57 64l5 4-5 2.5z" fill="#4e2a84" stroke="#3d3028" stroke-width="0.65"/>
</svg>
