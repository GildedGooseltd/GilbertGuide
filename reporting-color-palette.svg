<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2425" viewBox="0 0 1200 2425" role="img" aria-labelledby="title desc">
  <title id="title">Pav Law Reporting Color Palette</title>
  <desc id="desc">Gilded Goose reporting colors displayed as labeled swatches with names and hexadecimal values.</desc>
  <rect width="1200" height="2425" fill="#f8f5ef"/>
