    .family { font: 700 17px Arial, sans-serif; fill: #5c4f45; letter-spacing: 1px; }
    .name { font: 700 20px Arial, sans-serif; }
    .hex { font: 600 17px "SFMono-Regular", Consolas, monospace; }
    .use { font: 15px Arial, sans-serif; }
    .light { fill: #fffcf7; }
    .dark { fill: #3d3028; }
    .muted-light { fill: #f3ede4; }
    .muted-dark { fill: #5c4f45; }
    .card { stroke: rgba(61,48,40,.18); stroke-width: 1; }
    .rule { stroke: #c9a86c; stroke-width: 3; }
