<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc">
  <title id="title">Pav Law Reporting Components and Chart Examples</title>
  <desc id="desc">Examples of current tabs, KPI tiles, borders, callouts, tables, bar charts, line charts, and donut charts using the Gilded Goose reporting palette.</desc>
  <rect width="1200" height="1510" fill="#f8f5ef"/>
  <style>
    .h1 { font: 700 38px Georgia, serif; fill: #2d1454; }
    .h2 { font: 700 25px Georgia, serif; fill: #3d3028; }
    .h3 { font: 700 18px Arial, sans-serif; fill: #3a1a6e; }
    .body { font: 15px Arial, sans-serif; fill: #3d3028; }
    .small { font: 13px Arial, sans-serif; fill: #5c4f45; }
    .tiny { font: 11px Arial, sans-serif; fill: #5c4f45; }
    .value { font: 700 34px Arial, sans-serif; fill: #2d1454; }
    .white { fill: #fffcf7; }
    .paper { fill: #fffcf7; }
    .panel { fill: #ece6dc; }
    .border { stroke: rgba(61,48,40,.22); stroke-width: 1; }
    .royal-border { stroke: rgba(45,20,84,.38); stroke-width: 1.5; }
    .ornate-outer { fill: none; stroke: #a67c2e; stroke-width: 2; }
    .ornate-inner { fill: none; stroke: rgba(45,20,84,.38); stroke-width: 1; }
    .ornament { fill: #b8860b; stroke: #7a512b; stroke-width: .75; }
    .plot-bg { fill: #ece6dc; stroke: rgba(166,124,46,.55); stroke-width: 1; }
    .grid { stroke: rgba(61,48,40,.14); stroke-width: 1; }
    .axis { stroke: rgba(61,48,40,.45); stroke-width: 1.3; }
  </style>

  <text x="60" y="62" class="h1">Reporting UI examples</text>
  <text x="60" y="94" class="body">Use the current tabs, tiles, chart cards, legends, and always-visible detail tables.</text>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#c45c26" stroke-width="3"/>

  <text x="60" y="164" class="h2">Tabs</text>
  <rect x="60" y="184" width="1080" height="64" rx="10" fill="#fffcf7" class="border"/>
  <rect x="76" y="196" width="155" height="40" rx="7" fill="#3a1a6e"/>
  <text x="153" y="221" text-anchor="middle" class="body white" font-weight="700">KPIs</text>
  <text x="315" y="221" text-anchor="middle" class="body" font-weight="700">Project Guide</text>
  <text x="460" y="221" text-anchor="middle" class="body" font-weight="700">Impact</text>
  <text x="1118" y="221" text-anchor="end" class="small">Active = royal fill | focus = royal-mid outline</text>

  <text x="60" y="295" class="h2">KPI tiles and semantic states</text>
  <rect x="953" y="273" width="187" height="29" rx="14" fill="#e8d9b5" stroke="#a67c2e"/>
  <text x="1046" y="293" text-anchor="middle" class="small" fill="#3d3028" font-weight="700">APPROVED FORMAT</text>

  <g transform="translate(60 317)">
    <rect width="340" height="158" rx="10" fill="#fffcf7" class="border"/>
    <rect width="5" height="158" rx="2" fill="#cf2d56"/>
    <text x="24" y="34" class="small" font-weight="700">#21 ANSWERED CALLS</text>
    <text x="24" y="82" class="value" fill="#cf2d56">72%</text>
    <text x="24" y="108" class="body">Target 90%</text>
    <rect x="225" y="24" width="92" height="28" rx="14" fill="#f8d5de"/>
    <text x="271" y="43" text-anchor="middle" class="small" fill="#8f1738" font-weight="700">Below target</text>
    <text x="24" y="136" class="small">Red = action required</text>
  </g>

  <g transform="translate(430 317)">
    <rect width="340" height="158" rx="10" fill="#fffcf7" class="border"/>
    <rect width="5" height="158" rx="2" fill="#eab308"/>
    <text x="24" y="34" class="small" font-weight="700">#15 COST PER LEAD</text>
    <text x="24" y="82" class="value">$126</text>
    <text x="24" y="108" class="body">Target &lt;= $120</text>
    <rect x="233" y="24" width="84" height="28" rx="14" fill="#fff1a8"/>
    <text x="275" y="43" text-anchor="middle" class="small" fill="#664d00" font-weight="700">Watch</text>
    <text x="24" y="136" class="small">Yellow = caution / review</text>
  </g>

  <g transform="translate(800 317)">
    <rect width="340" height="158" rx="10" fill="#fffcf7" class="border"/>
    <rect width="5" height="158" rx="2" fill="#1f8a65"/>
    <text x="24" y="34" class="small" font-weight="700">#12 COST PER CALL</text>
    <text x="24" y="82" class="value">$41</text>
    <text x="24" y="108" class="body">Target &lt; $100</text>
    <rect x="225" y="24" width="92" height="28" rx="14" fill="#d4eee5"/>
    <text x="271" y="43" text-anchor="middle" class="small" fill="#155d45" font-weight="700">On track</text>
    <text x="24" y="136" class="small">Green = verified / positive</text>
  </g>

  <text x="60" y="527" class="h2">Borders and callouts</text>

  <g transform="translate(60 550)">
    <rect width="510" height="88" rx="8" fill="#fffcf7" stroke="rgba(45,20,84,.38)" stroke-width="1.5"/>
    <rect x="6" y="6" width="498" height="76" rx="5" class="ornate-inner"/>
    <rect width="5" height="88" fill="#3a1a6e"/>
    <path d="M12 15h22 M12 15v18 M498 15h-22 M498 15v18 M12 73h22 M12 73v-18 M498 73h-22 M498 73v-18" class="ornate-outer"/>
    <rect x="249" y="4" width="12" height="12" transform="rotate(45 255 10)" class="ornament"/>
    <text x="24" y="32" class="h3">Information / context</text>
    <text x="24" y="58" class="small">Royal left rule + paper surface. Use for definitions and methodology.</text>
  </g>
  <g transform="translate(630 550)">
    <rect width="510" height="88" rx="8" fill="#fff8d6" stroke="#d2a900" stroke-width="1.5"/>
    <rect x="6" y="6" width="498" height="76" rx="5" class="ornate-inner"/>
    <rect width="5" height="88" fill="#eab308"/>
    <path d="M12 15h22 M12 15v18 M498 15h-22 M498 15v18 M12 73h22 M12 73v-18 M498 73h-22 M498 73v-18" class="ornate-outer"/>
    <rect x="249" y="4" width="12" height="12" transform="rotate(45 255 10)" class="ornament"/>
    <text x="24" y="32" class="h3" fill="#664d00">Attention / pending</text>
    <text x="24" y="58" class="small">Yellow left rule + pale yellow wash. Pair with a written status.</text>
  </g>
  <g transform="translate(60 656)">
    <rect width="510" height="88" rx="8" fill="#f3eefa" stroke="#4c1d95" stroke-width="1.5"/>
    <rect x="6" y="6" width="498" height="76" rx="5" class="ornate-inner"/>
    <rect width="5" height="88" fill="#4c1d95"/>
    <path d="M12 15h22 M12 15v18 M498 15h-22 M498 15v18 M12 73h22 M12 73v-18 M498 73h-22 M498 73v-18" class="ornate-outer"/>
    <rect x="249" y="4" width="12" height="12" transform="rotate(45 255 10)" class="ornament"/>
    <text x="24" y="32" class="h3">Recommended project</text>
    <text x="24" y="58" class="small">Royal-mid inset rule + light royal wash. Keep current card layout.</text>
  </g>
  <g transform="translate(630 656)">
    <rect width="510" height="88" rx="8" fill="#e2f3ec" stroke="#1f8a65" stroke-width="1.5"/>
    <rect x="6" y="6" width="498" height="76" rx="5" class="ornate-inner"/>
    <rect width="5" height="88" fill="#1f8a65"/>
    <path d="M12 15h22 M12 15v18 M498 15h-22 M498 15v18 M12 73h22 M12 73v-18 M498 73h-22 M498 73v-18" class="ornate-outer"/>
    <rect x="249" y="4" width="12" height="12" transform="rotate(45 255 10)" class="ornament"/>
    <text x="24" y="32" class="h3" fill="#155d45">Verified / successful</text>
    <text x="24" y="58" class="small">Green outline only when the status is supported by data.</text>
  </g>

  <text x="60" y="800" class="h2">Sample chart layouts</text>

  <!-- Combo bar + line card -->
  <g transform="translate(60 824)">
    <rect width="525" height="388" rx="10" fill="#fffcf7" class="royal-border"/>
    <rect x="5" y="5" width="515" height="378" rx="7" class="ornate-inner"/>
    <rect width="525" height="58" rx="10" fill="#ece6dc"/>
    <rect y="50" width="525" height="8" fill="#ece6dc"/>
    <rect width="5" height="58" fill="#3a1a6e"/>
    <text x="22" y="28" class="h3">Cases, leads &amp; spend</text>
    <text x="22" y="47" class="tiny">Bars = volume | line = spend | newest first</text>

    <rect x="44" y="88" width="455" height="188" rx="8" class="plot-bg"/>
    <line x1="54" y1="102" x2="54" y2="256" class="axis"/>
    <line x1="54" y1="256" x2="489" y2="256" class="axis"/>
    <line x1="54" y1="218" x2="489" y2="218" class="grid"/>
    <line x1="54" y1="180" x2="489" y2="180" class="grid"/>
    <line x1="54" y1="142" x2="489" y2="142" class="grid"/>

    <rect x="94" y="153" width="28" height="103" fill="#3a1a6e"/>
    <rect x="122" y="190" width="28" height="66" fill="#1e3a8a"/>
    <rect x="150" y="224" width="28" height="32" fill="#b23a78"/>
    <rect x="229" y="170" width="28" height="86" fill="#3a1a6e"/>
    <rect x="257" y="204" width="28" height="52" fill="#1e3a8a"/>
    <rect x="285" y="230" width="28" height="26" fill="#b23a78"/>
    <rect x="364" y="188" width="28" height="68" fill="#3a1a6e"/>
    <rect x="392" y="215" width="28" height="41" fill="#1e3a8a"/>
    <rect x="420" y="236" width="28" height="20" fill="#b23a78"/>
    <polyline points="136,125 271,147 406,166" fill="none" stroke="#6a5acd" stroke-width="4"/>
    <circle cx="136" cy="125" r="5" fill="#6a5acd"/>
    <circle cx="271" cy="147" r="5" fill="#6a5acd"/>
    <circle cx="406" cy="166" r="5" fill="#6a5acd"/>
    <text x="136" y="278" text-anchor="middle" class="tiny">Jul</text>
    <text x="271" y="278" text-anchor="middle" class="tiny">Jun</text>
    <text x="406" y="278" text-anchor="middle" class="tiny">May</text>

    <circle cx="66" cy="305" r="6" fill="#3a1a6e"/><text x="78" y="310" class="tiny">Cases</text>
    <circle cx="145" cy="305" r="6" fill="#1e3a8a"/><text x="157" y="310" class="tiny">LSA</text>
    <circle cx="211" cy="305" r="6" fill="#b23a78"/><text x="223" y="310" class="tiny">Website</text>
    <line x1="300" y1="305" x2="324" y2="305" stroke="#6a5acd" stroke-width="4"/><text x="333" y="310" class="tiny">Spend</text>

    <line x1="22" y1="328" x2="503" y2="328" class="grid"/>
    <text x="22" y="350" class="tiny" font-weight="700">Period</text>
    <text x="184" y="350" class="tiny" font-weight="700">Cases</text>
    <text x="268" y="350" class="tiny" font-weight="700">LSA</text>
    <text x="348" y="350" class="tiny" font-weight="700">Website</text>
    <text x="453" y="350" class="tiny" font-weight="700">Spend</text>
    <text x="22" y="374" class="tiny">Jul 2026</text>
    <text x="198" y="374" class="tiny">18</text>
    <text x="278" y="374" class="tiny">12</text>
    <text x="368" y="374" class="tiny">5</text>
    <text x="450" y="374" class="tiny">$8.2k</text>
  </g>

  <!-- Practice area bars -->
  <g transform="translate(615 824)">
    <rect width="525" height="388" rx="10" fill="#fffcf7" class="royal-border"/>
    <rect x="5" y="5" width="515" height="378" rx="7" class="ornate-inner"/>
    <rect width="525" height="58" rx="10" fill="#ece6dc"/>
    <rect y="50" width="525" height="8" fill="#ece6dc"/>
    <rect width="5" height="58" fill="#3a1a6e"/>
    <text x="22" y="28" class="h3">Mean fee by practice area</text>
    <text x="22" y="47" class="tiny">Fixed practice-area colors | direct labels | n shown</text>

    <rect x="128" y="70" width="372" height="260" rx="8" class="plot-bg"/>
    <text x="22" y="96" class="tiny">Sex offense</text>
    <rect x="142" y="80" width="324" height="18" rx="3" fill="#6a5acd"/>
    <text x="476" y="95" class="tiny">$9.5k</text>
    <text x="22" y="133" class="tiny">Theft</text>
    <rect x="142" y="117" width="250" height="18" rx="3" fill="#334155"/>
    <text x="402" y="132" class="tiny">$7.3k</text>
    <text x="22" y="170" class="tiny">Assault</text>
    <rect x="142" y="154" width="223" height="18" rx="3" fill="#c45c26"/>
    <text x="375" y="169" class="tiny">$6.5k</text>
    <text x="22" y="207" class="tiny">DV</text>
    <rect x="142" y="191" width="185" height="18" rx="3" fill="#b23a78"/>
    <text x="337" y="206" class="tiny">$5.4k</text>
    <text x="22" y="244" class="tiny">Criminal</text>
    <rect x="142" y="228" width="157" height="18" rx="3" fill="#3a1a6e"/>
    <text x="309" y="243" class="tiny">$4.6k</text>
    <text x="22" y="281" class="tiny">Probation</text>
    <rect x="142" y="265" width="154" height="18" rx="3" fill="#64748b"/>
    <text x="306" y="280" class="tiny">$4.5k</text>
    <text x="22" y="318" class="tiny">DUI / Traffic</text>
    <rect x="142" y="302" width="121" height="18" rx="3" fill="#1e3a8a"/>
    <text x="273" y="317" class="tiny">$3.5k</text>

    <line x1="22" y1="342" x2="503" y2="342" class="grid"/>
    <text x="22" y="366" class="tiny">Detail table remains directly below the plot in the live card.</text>
  </g>

  <!-- Donut + line mini examples -->
  <g transform="translate(60 1242)">
    <rect width="525" height="220" rx="10" fill="#fffcf7" class="royal-border"/>
    <rect x="5" y="5" width="515" height="210" rx="7" class="ornate-inner"/>
    <text x="22" y="34" class="h3">Source mix donut</text>
    <rect x="22" y="51" width="481" height="149" rx="8" class="plot-bg"/>
    <circle cx="120" cy="126" r="58" fill="none" stroke="#3a1a6e" stroke-width="26" stroke-dasharray="155 365" transform="rotate(-90 120 126)"/>
    <circle cx="120" cy="126" r="58" fill="none" stroke="#1e3a8a" stroke-width="26" stroke-dasharray="115 405" stroke-dashoffset="-155" transform="rotate(-90 120 126)"/>
    <circle cx="120" cy="126" r="58" fill="none" stroke="#b23a78" stroke-width="26" stroke-dasharray="82 438" stroke-dashoffset="-270" transform="rotate(-90 120 126)"/>
    <circle cx="120" cy="126" r="58" fill="none" stroke="#64748b" stroke-width="26" stroke-dasharray="38 482" stroke-dashoffset="-352" transform="rotate(-90 120 126)"/>
    <text x="120" y="132" text-anchor="middle" class="h3">100%</text>
    <circle cx="232" cy="82" r="6" fill="#3a1a6e"/><text x="245" y="87" class="small">Paid Search 42%</text>
    <circle cx="232" cy="113" r="6" fill="#1e3a8a"/><text x="245" y="118" class="small">LSA 31%</text>
    <circle cx="232" cy="144" r="6" fill="#b23a78"/><text x="245" y="149" class="small">Website 18%</text>
    <circle cx="232" cy="175" r="6" fill="#64748b"/><text x="245" y="180" class="small">Referral 9%</text>
  </g>

  <g transform="translate(615 1242)">
    <rect width="525" height="220" rx="10" fill="#fffcf7" class="royal-border"/>
    <rect x="5" y="5" width="515" height="210" rx="7" class="ornate-inner"/>
    <text x="22" y="34" class="h3">Cash in vs spend trend</text>
    <rect x="44" y="51" width="452" height="137" rx="8" class="plot-bg"/>
    <line x1="54" y1="63" x2="54" y2="176" class="axis"/>
    <line x1="54" y1="176" x2="496" y2="176" class="axis"/>
    <line x1="54" y1="138" x2="496" y2="138" class="grid"/>
    <line x1="54" y1="100" x2="496" y2="100" class="grid"/>
    <polyline points="86,145 205,122 324,88 453,72" fill="none" stroke="#1f8a65" stroke-width="4"/>
    <polyline points="86,158 205,150 324,142 453,134" fill="none" stroke="#6a5acd" stroke-width="4"/>
    <circle cx="86" cy="145" r="4" fill="#1f8a65"/><circle cx="205" cy="122" r="4" fill="#1f8a65"/><circle cx="324" cy="88" r="4" fill="#1f8a65"/><circle cx="453" cy="72" r="4" fill="#1f8a65"/>
    <circle cx="86" cy="158" r="4" fill="#6a5acd"/><circle cx="205" cy="150" r="4" fill="#6a5acd"/><circle cx="324" cy="142" r="4" fill="#6a5acd"/><circle cx="453" cy="134" r="4" fill="#6a5acd"/>
    <line x1="64" y1="204" x2="88" y2="204" stroke="#1f8a65" stroke-width="4"/><text x="96" y="209" class="tiny">Cash in</text>
    <line x1="178" y1="204" x2="202" y2="204" stroke="#6a5acd" stroke-width="4"/><text x="210" y="209" class="tiny">Spend</text>
